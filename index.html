<style>
/* Layout: sticky header + tab bar over one scrolling column; lists in cards on a soft lavender wash. */
:root {
  --bg: #f6f2fa;
  --wash: linear-gradient(135deg, #f8dcea 0%, #e6dcf6 48%, #d4e7f6 100%);
  --surface: #ffffff;
  --surface-2: #f1ebf8;
  --ink: #2a2433;
  --muted: #6c6479;
  --line: #e2d9ee;
  --accent: #7a5cb3;
  --accent-ink: #ffffff;
  --accent-soft: #e9e0f7;
  --pink: #d9689c;
  --good: #2b8a54;
  --bad: #bf4038;
  --shadow: 0 1px 2px rgba(60, 40, 90, .08), 0 6px 20px rgba(60, 40, 90, .06);

  --font-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16121d;
    --wash: linear-gradient(135deg, #2c1a2a 0%, #241d38 48%, #172337 100%);
    --surface: #211b2c;
    --surface-2: #2b2339;
    --ink: #efe9f7;
    --muted: #a99fba;
    --line: #382e4a;
    --accent: #b99cf2;
    --accent-ink: #1b1428;
    --accent-soft: #35294d;
    --pink: #ee86b4;
    --good: #6cc791;
    --bad: #f28c84;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16121d;
  --wash: linear-gradient(135deg, #2c1a2a 0%, #241d38 48%, #172337 100%);
  --surface: #211b2c;
  --surface-2: #2b2339;
  --ink: #efe9f7;
  --muted: #a99fba;
  --line: #382e4a;
  --accent: #b99cf2;
  --accent-ink: #1b1428;
  --accent-soft: #35294d;
  --pink: #ee86b4;
  --good: #6cc791;
  --bad: #f28c84;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0; background: var(--wash); opacity: .55; z-index: -1; pointer-events: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 960px; margin: 0 auto; padding-bottom: 40px; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 8px; flex-wrap: wrap; }
.brandmark { font: 700 24px/1 var(--font-display); letter-spacing: -.01em; margin: 0; flex: 1 1 auto; min-width: 0; }
.brandmark small { display: block; font: 500 12px/1.3 var(--font-body); letter-spacing: 0; color: var(--muted); margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; max-width: 100%; }
.chip.plain { padding: 5px 12px; }
.chip img { width: 22px; height: 22px; border-radius: 50%; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px; display: inline-grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }

/* tabs */
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 0; background: transparent; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tab svg { width: 17px; height: 17px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .count { font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 7px; min-width: 20px; text-align: center; }
.tab[aria-selected="true"] .count { background: rgba(255, 255, 255, .25); color: inherit; }
@media (max-width: 520px) { .tab { padding: 9px 10px; } .tab .label { display: none; } .tab[aria-selected="true"] .label { display: inline; } }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 38px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 14px; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-size: 14px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; padding: 0 2px 8px; }
.summary b { color: var(--ink); font-weight: 600; }

/* menus */
.pop { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; }
.pop button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.pop button:hover { background: var(--surface-2); }
.pop button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
.pop svg { width: 16px; height: 16px; flex: none; }
.anchor { position: relative; display: inline-block; }

/* groups & rows */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.ghead { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 12px 14px; text-align: left; font: 600 16px/1.2 var(--font-display); }
.ghead .chev { width: 16px; height: 16px; flex: none; transition: transform .15s; color: var(--muted); }
.ghead[aria-expanded="true"] .chev { transform: rotate(90deg); }
.ghead .n { margin-left: auto; font: 500 12px var(--font-body); color: var(--muted); }
.ghead .gt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sub { border-top: 1px solid var(--line); }
.subhead { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface-2); padding: 8px 14px 8px 18px; text-align: left; font-weight: 600; font-size: 14px; color: var(--accent); }
.subhead .chev { width: 14px; height: 14px; transition: transform .15s; flex: none; }
.subhead[aria-expanded="true"] .chev { transform: rotate(90deg); }
.subhead .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }

.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.ghead + .row, .subhead + .row { border-top: 1px solid var(--line); }
.row .main { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; padding: 0; text-align: left; display: flex; align-items: center; gap: 12px; }
.row .txt { min-width: 0; flex: 1 1 auto; }
.row .nm { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.row .br { font-size: 12px; color: var(--muted); }
.row .co { font-size: 13px; color: var(--accent); }
.row .fi { font-size: 12px; color: var(--muted); }
.row .side { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: var(--muted); }
.row .side .price { font-size: 12px; }
.row .side.strong .price { font-size: 14px; font-weight: 600; color: var(--ink); }
.row .side .in { color: var(--good); } .row .side .out { color: var(--bad); }
.row .side:not(.strong) .in, .row .side:not(.strong) .out { color: var(--muted); font-size: 11px; }
.tag { font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
.tag svg { width: 11px; height: 11px; }
.more { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; color: var(--muted); }
.more:hover { background: var(--surface-2); }
.more svg { width: 18px; height: 18px; }
@media (max-width: 480px) { .row .side .perml { display: none; } }

.thumb { position: relative; flex: none; border-radius: 22%; overflow: hidden; border: 2.5px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.logo img { object-fit: contain; padding: 12%; }
.thumb .q { font-size: 12px; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty b { display: block; font: 600 17px var(--font-display); color: var(--ink); margin-bottom: 4px; }

/* brand tiles (database > brands) */
.brandrow { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 10px 14px; text-align: left; }
.brandrow:first-child { border-top: 0; }
.brandrow .nm { font: 600 16px var(--font-display); }
.brandrow .sub2 { font-size: 12px; color: var(--muted); }
.brandrow .chev { margin-left: auto; width: 16px; height: 16px; color: var(--muted); }

/* detail */
.backbar { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
.detail h2 { font: 700 26px/1.15 var(--font-display); margin: 6px 0 2px; overflow-wrap: anywhere; }
.detail .by { color: var(--muted); margin: 0 0 14px; }
.by button, .link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.status-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
.status-pick button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.status-pick button svg { width: 20px; height: 20px; }
.status-pick button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.gallery { position: relative; margin-bottom: 14px; }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; height: 300px; display: grid; place-items: center; padding: 10px; }
.slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 16px; }
.slide .nophoto { color: var(--muted); font-size: 13px; text-align: center; }
.dots { display: flex; gap: 6px; justify-content: center; padding-top: 8px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--ink); }
.arrow { position: absolute; top: 140px; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); opacity: .9; display: grid; place-items: center; }
.arrow.l { left: 8px; } .arrow.r { right: 8px; }
.arrow svg { width: 16px; height: 16px; }
.bigsw { height: 160px; border-radius: 18px; border: 1px solid var(--line); display: grid; place-items: center; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.panel h3 { margin: 0; padding: 12px 14px 4px; font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 14px; border-top: 1px solid var(--line); align-items: center; }
.panel h3 + .kv { border-top: 0; }
.kv span:first-child { color: var(--muted); flex: none; }
.kv span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; flex: none; }
.about { padding: 6px 14px 14px; font-size: 14px; white-space: pre-line; }
.linkrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.panel h3 + .linkrow { border-top: 0; }
.linkrow svg.ext { margin-left: auto; width: 14px; height: 14px; color: var(--muted); }
.linkrow .ig, .glyph { width: 22px; height: 22px; flex: none; }
.tagrow { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 14px 14px; }
.tagrow a { background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; text-decoration: none; }

/* brand header */
.bhead { display: flex; gap: 14px; align-items: center; padding: 6px 0 12px; }
.bhead h2 { font: 700 26px/1.1 var(--font-display); margin: 0; overflow-wrap: anywhere; }
.bhead .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.socials { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 12px; align-items: center; }
.soc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-size: 14px; }
.soc svg { width: 20px; height: 20px; }

.sheet-back { position: fixed; inset: 0; background: rgba(15, 10, 25, .45); z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: min(560px, 100%); max-height: 86vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--line); }
.sheet .hd { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.sheet .hd b { font: 700 18px var(--font-display); flex: 1; text-align: center; }
.sheet details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
.sheet summary { padding: 12px 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
.sheet summary::-webkit-details-marker { display: none; }
.sheet summary .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 14px; text-align: left; }
.opt .ck { margin-left: auto; width: 16px; height: 16px; color: var(--accent); visibility: hidden; }
.opt[aria-pressed="true"] .ck { visibility: visible; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.field label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.pricein { display: flex; gap: 8px; align-items: center; }
.pricein input { width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.switch { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 4px 0 10px; }
.note b { color: var(--ink); }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

        else g.polishes.forEach(p => card.append(polishRow(p, { showBrand })));
      }
      frag.append(card);
    }
  }
  return frag;
}

function emptyMessage() {
  if (state.search || filtersActive()) return ["No matches", "Try fewer words or clear the filters."];
  switch (state.tab) {
    case "stash": return ["Your stash is empty", "Open a polish in the Database and add it to your stash."];
    case "wishlist": return ["Your wishlist is empty", "Add polishes you want from the Database."];
    case "destash": return ["Nothing to destash", "Move polishes here when you plan to sell them."];
    case "archive": return ["Archive is empty", "Destashed polishes can be moved here."];
    default: return ["Nothing here", ""];
  }
}

function renderBar() {
  const box = $("#bar"); box.replaceChildren();
  if (state.nav.length && state.nav[state.nav.length - 1].type === "polish") return;
  const inBrand = listScope() === "brand";
  const showBrandsGrid = state.tab === "database" && state.dbMode === "brands" && !inBrand;

  const input = h("input", { id: "q", type: "search", placeholder: "Search brand, shade or collection", value: state.search, "aria-label": "Search" });
  let t; input.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { state.search = input.value; renderContent(); }, 140); });
  const bar = h("div", { class: "bar" }, h("label", { class: "search" }, ic("search"), input));

  if (state.tab === "database" && !inBrand) {
    bar.append(h("div", { class: "seg", role: "group" },
      h("button", { "aria-pressed": String(state.dbMode === "brands"), onclick: () => { state.dbMode = "brands"; renderAll(); } }, "Brands"),
      h("button", { "aria-pressed": String(state.dbMode === "polishes"), onclick: () => { state.dbMode = "polishes"; renderAll(); } }, "Polishes")));
  }
  if (!showBrandsGrid) {
    if (!inBrand) {
      const SORTS = [["brand", "Brand", "tag"], ["color", "Color", "database"], ["finish", "Finish", "sort"], ["collection", "Collection", "stash"], ["collectionType", "Collection Type", "archive"]];
      const sb = h("button", { class: "btn", "data-pop": "1" }, ic("sort"), "Sort: " + SORTS.find(s => s[0] === state.sort)[1]);
      sb.addEventListener("click", () => popMenu(sb, SORTS.map(s => ({ label: s[1], checked: state.sort === s[0], run: () => { state.sort = s[0]; renderAll(); } }))));
      bar.append(h("span", { class: "anchor" }, sb));
    }
    bar.append(h("button", { class: "btn" + (filtersActive() ? " on" : ""), onclick: openFilters }, ic("filter"), "Filter"));
    if (["stash", "wishlist", "destash"].includes(state.tab) && !inBrand)
      bar.append(h("button", { class: "btn", onclick: exportCsv, title: "Download this list as CSV" }, ic("export"), "CSV"));
  }
  box.append(bar);
}

function renderContent() {
  const box = $("#content"); box.replaceChildren();
  if (!state.catalog) { box.append(h("div", { class: "loading" }, "Loading the catalog…")); return; }
  const nav = state.nav[state.nav.length - 1];
  if (nav && nav.type === "polish") { box.append(polishDetail(BY_ID.get(nav.id))); return; }

  if (nav && nav.type === "brand") box.append(brandHeader(BRANDS.find(b => b.name === nav.name)));
  else if (state.tab === "database" && state.dbMode === "brands") { renderBrandList(box); return; }

  const items = filtered();
  const total = items.reduce((s, p) => s + (p.price || 0), 0);
  const parts = [h("span", null, h("b", null, items.length), items.length === 1 ? " polish" : " polishes")];
  if (["stash", "wishlist", "destash", "archive"].includes(state.tab) && !nav && total > 0) parts.push(h("span", null, "Total value ", h("b", null, MONEY.format(total))));
  box.append(h("div", { class: "summary" }, parts));
  if (!items.length) { const [a, b] = emptyMessage(); box.append(h("div", { class: "empty" }, h("b", null, a), b)); return; }
  box.append(renderList(items));
}

function renderBrandList(box) {
  let list = BRANDS.slice();
  if (state.search) {
    const words = foldKey(state.search).split(/\s+/).filter(Boolean);
    const hits = P.filter(p => words.every(w => p.search.includes(w)));
    if (!hits.length) { box.append(h("div", { class: "empty" }, h("b", null, "No matches"), "Try fewer words.")); return; }
    const byBrand = new Map(); hits.forEach(p => { if (!byBrand.has(p.brand.name)) byBrand.set(p.brand.name, []); byBrand.get(p.brand.name).push(p); });
    box.append(h("div", { class: "summary" }, h("span", null, h("b", null, hits.length), hits.length === 1 ? " polish" : " polishes", ` in ${byBrand.size} brand${byBrand.size === 1 ? "" : "s"}`)));
    for (const [name, ps] of [...byBrand].sort((a, b) => cmp(a[0], b[0]))) {
      const card = h("div", { class: "card" }, h("button", { class: "ghead", "aria-expanded": "true", onclick: () => openBrand(name) }, h("span", { class: "gt" }, name), h("span", { class: "n" }, ps.length)));
      ps.sort(collThenName).slice(0, 40).forEach(p => card.append(polishRow(p, { showBrand: false })));
      if (ps.length > 40) card.append(h("div", { class: "row" }, h("button", { class: "link", onclick: () => openBrand(name) }, `See all ${ps.length} in ${name}`)));
      box.append(card);
    }
    return;
  }
  box.append(h("div", { class: "summary" }, h("span", null, h("b", null, list.length), " brands")));
  list.sort((a, b) => cmp(a.name, b.name));
  const card = h("div", { class: "card" });
  for (const b of list) card.append(h("button", { class: "brandrow", onclick: () => openBrand(b.name) },
    brandThumb(b), h("div", null, h("div", { class: "nm" }, b.name), h("div", { class: "sub2" }, [`${b.count} polish${b.count === 1 ? "" : "es"}`, countryText(b.country)].filter(Boolean).join(" · "))), ic("chev", "chev")));
  box.append(card);
}

function renderAll() { renderTabs(); renderBar(); renderContent(); }

/* ---------- navigation ---------- */
function openPolish(p) { state.nav.push({ type: "polish", id: p.id }); renderAll(); window.scrollTo({ top: 0 }); loadExtra(); }
function openBrand(name) {
  state.nav.push({ type: "brand", name });
  state.search = ""; state.filters = { finishes: new Set(), colors: new Set(), inStock: false, min: "", max: "" };
  renderAll(); window.scrollTo({ top: 0 });
}
function back() { state.nav.pop(); renderAll(); }

/* ---------- brand header ---------- */
function brandHeader(b) {
  const frag = document.createDocumentFragment();
  frag.append(h("div", { class: "backbar" }, h("button", { class: "btn", onclick: back }, ic("back"), "Back")));
  const country = countryText(b.country);
  frag.append(h("div", { class: "bhead" }, brandThumb(b, 64), h("div", null, h("h2", null, b.name),
    h("div", { class: "meta" }, [`${b.count} polish${b.count === 1 ? "" : "es"}`, country].filter(Boolean).join(" · ")))));
  const links = h("div", { class: "socials" });
  if (b.website) links.append(h("a", { class: "soc", href: b.website, target: "_blank", rel: "noopener" }, ic("globe"), "Website"));
  const ig = igUrl(b.ig), fb = fbUrl(b.fb);
  if (ig) links.append(h("a", { class: "soc", href: ig, target: "_blank", rel: "noopener" }, IG_GLYPH(), "Instagram"));
  if (fb) links.append(h("a", { class: "soc", href: fb, target: "_blank", rel: "noopener" }, FB_GLYPH(), "Facebook group"));
  if (links.children.length) frag.append(links);
  return frag;
}

/* ---------- polish detail ---------- */
function loadExtra() {
  if (state.extra || state.extraLoading) return state.extraLoading;
  state.extraLoading = fetch("details.json").then(r => r.json()).then(d => { state.extra = d; renderContent(); }).catch(() => { state.extra = {}; });
  return state.extraLoading;
}
function photoUrls(p) {
  const ex = state.extra && state.extra[p.id];
  const urls = ex && ex[1] && ex[1].length ? ex[1] : (p.image ? [p.image] : []);
  return urls;
}
function gallery(urls, fallbackEl) {
  const wrap = h("div", { class: "gallery" });
  const n = urls.length, loop = n > 1;
  const pages = loop ? [urls[n - 1], ...urls, urls[0]] : urls;
  let failures = 0;
  const track = h("div", { class: "track", tabindex: "0", "aria-label": "Photos" },
    pages.map((u, i) => {
      const slide = h("div", { class: "slide" });
      slide.append(h("img", { src: u, alt: "", referrerpolicy: "no-referrer", onerror: () => {
        slide.replaceChildren(h("div", { class: "nophoto" }, "Photo unavailable")); failures++;
        if (failures >= pages.length && fallbackEl) wrap.replaceWith(fallbackEl);
      } }));
      return slide;
    }));
  wrap.append(track);
  if (!loop) return wrap;
  const dots = h("div", { class: "dots" }, urls.map(() => h("i")));
  const mark = i => [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
  const jump = i => { track.style.scrollSnapType = "none"; track.scrollLeft = i * track.clientWidth; requestAnimationFrame(() => { track.style.scrollSnapType = ""; }); };
  let timer;
  const settle = () => {
    const w = track.clientWidth || 1, i = Math.round(track.scrollLeft / w);
    if (i === 0) { jump(n); mark(n - 1); } else if (i === n + 1) { jump(1); mark(0); } else mark(i - 1);
  };
  track.addEventListener("scroll", () => { clearTimeout(timer); timer = setTimeout(settle, 90); }, { passive: true });
  const step = dir => track.scrollBy({ left: dir * track.clientWidth, behavior: "smooth" });
  track.addEventListener("keydown", e => { if (e.key === "ArrowRight") { e.preventDefault(); step(1); } if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); } });
  wrap.append(h("button", { class: "arrow l", "aria-label": "Previous photo", onclick: () => step(-1) }, ic("back")),
    h("button", { class: "arrow r", "aria-label": "Next photo", onclick: () => step(1) }, ic("chev")), dots);
  mark(0);
  requestAnimationFrame(() => requestAnimationFrame(() => jump(1)));
  return wrap;
}
function kv(k, v) { return h("div", { class: "kv" }, h("span", null, k), h("span", null, v)); }

function polishDetail(p) {
  const el = h("div", { class: "detail" });
  if (!p) return el;
  el.append(h("div", { class: "backbar" }, h("button", { class: "btn", onclick: back }, ic("back"), "Back")));
  el.append(h("h2", null, p.name));
  el.append(h("p", { class: "by" }, "by ", h("button", { onclick: () => { state.nav = state.nav.filter(n => n.type !== "polish"); const t = state.nav[state.nav.length - 1]; if (t && t.type === "brand" && t.name === p.brand.name) { renderAll(); window.scrollTo({ top: 0 }); } else openBrand(p.brand.name); } }, p.brand.name)));

  const cur = statusOf(p);
  el.append(h("div", { class: "status-pick" }, STATUS_ORDER.map(s =>
    h("button", { "aria-pressed": String(cur === s), onclick: () => setStatus(p, cur === s ? null : s) }, ic(STATUS[s].icon), STATUS[s].label))));

  const swatch = h("div", { class: "bigsw", style: `background:${p.base.length ? SWATCH[p.base[0]] : "var(--surface-2)"}` }, p.base.length ? null : h("span", { class: "q" }, "No photo"));
  const urls = photoUrls(p);
  if (urls.length) el.append(gallery(urls, swatch));
  else if (state.extraLoading && !state.extra) el.append(h("div", { class: "bigsw" }, h("span", { class: "q" }, "Loading photos…")));
  else el.append(swatch);

  const details = h("div", { class: "panel" }, h("h3", null, "Details"), kv("Brand", p.brand.name));
  if (p.collection) details.append(kv("Collection", p.collection));
  const rel = releaseText(p); if (rel) details.append(kv("Released", rel));
  if (p.pstatus) details.append(kv("Availability", PSTATUS[p.pstatus]));
  if (p.base.length) details.append(kv("Base color", [h("i", { class: "sw", style: `background:${SWATCH[p.base[0]]}` }), p.base.join(", ")]));
  if (p.other.length) details.append(kv("Accent colors", p.other.join(", ")));
  if (p.finishes.length) details.append(kv("Finishes", p.finishes.map(f => f.replace(/\b\w/g, c => c.toUpperCase())).join(", ")));
  if (p.ctype) details.append(kv("Collection type", p.ctype));
  if (p.brand.bottle) details.append(kv("Bottle size", `${+p.brand.bottle.toFixed(1)} mL`));
  if (p.price != null) details.append(kv("Price", MONEY.format(p.price)));
  if (p.ppm != null) details.append(kv("Price per mL", MONEY.format(p.ppm)));
  el.append(details);

  const ex = state.extra && state.extra[p.id];
  if (ex && ex[0]) el.append(h("div", { class: "panel" }, h("h3", null, "About"), h("div", { class: "about" }, ex[0])));

  // Instagram: hashtag pages open in the Instagram app; a keyword-search address does not.
  const b = hashtag(p.brand.name), n = hashtag(p.name), tags = [];
  for (const t of [b + n, n, b]) if (t && !tags.includes(t)) tags.push(t);
  if (tags.length) el.append(h("div", { class: "panel" }, h("h3", null, "Find more swatches on Instagram"),
    h("div", { class: "tagrow" }, tags.map(t => h("a", { href: `https://www.instagram.com/explore/tags/${encodeURIComponent(t)}/`, target: "_blank", rel: "noopener" }, "#" + t)))));

  const buy = h("div", { class: "panel" }, h("h3", null, "Where to buy"));
  if (p.url || p.price != null || p.stock != null) {
    const inner = [h("div", null, h("div", { style: "font-weight:600" }, p.brand.name), p.url ? h("div", { class: "br", style: "font-size:12px;color:var(--muted)" }, "Open the shop page") : null), h("span", { style: "margin-left:auto;text-align:right" },
      p.price != null ? h("div", null, MONEY.format(p.price)) : null,
      p.stock === 1 ? h("div", { class: "in", style: "color:var(--good);font-size:12px" }, "In stock") : p.stock === 0 ? h("div", { style: "color:var(--bad);font-size:12px" }, "Out of stock") : null)];
    buy.append(p.url ? h("a", { class: "linkrow", href: p.url, target: "_blank", rel: "noopener" }, inner, ic("ext", "ext")) : h("div", { class: "linkrow" }, inner));
  } else buy.append(h("div", { class: "kv" }, h("span", null, "No listings")));
  el.append(buy);

  const dupes = p.dupes.map(id => BY_ID.get(id)).filter(d => d && d !== p);
  if (dupes.length) {
    const panel = h("div", { class: "panel" }, h("h3", null, "Dupes"));
    dupes.forEach(d => panel.append(h("div", { class: "row", style: "border-top:0;border-top:1px solid var(--line)" }, h("button", { class: "main", onclick: () => { state.nav[state.nav.length - 1] = { type: "polish", id: d.id }; renderAll(); window.scrollTo({ top: 0 }); } },
      thumb(d, 40), h("div", { class: "txt" }, h("div", { class: "nm" }, d.name), h("div", { class: "br" }, d.brand.name)), d.price != null ? h("div", { class: "side" }, h("span", { class: "price" }, MONEY.format(d.price))) : null))));
    el.append(panel);
  }
  return el;
}

/* ---------- filter sheet ---------- */
function openFilters() {
  const layer = $("#layer"); layer.replaceChildren();
  const f = state.filters;
  const pool = basePool();
  const finishes = [...new Set(pool.flatMap(p => p.finishes))].sort(cmp);
  const present = new Set(pool.flatMap(p => p.base));
  const colors = [...COLOR_ORDER.filter(c => present.has(c)), ...[...present].filter(c => !COLOR_ORDER.includes(c)).sort(cmp)];
  const close = () => { layer.replaceChildren(); renderAll(); };
  const clear = h("button", { class: "btn", onclick: () => { state.filters = { finishes: new Set(), colors: new Set(), inStock: false, min: "", max: "" }; openFilters(); } }, "Clear filters");
  if (!filtersActive()) clear.setAttribute("disabled", "");

  const opt = (label, set, value, sw) => {
    const b = h("button", { class: "opt", "aria-pressed": String(set.has(value)) }, sw ? h("i", { class: "sw", style: `background:${sw}` }) : null, label, ic("check", "ck"));
    b.addEventListener("click", () => { set.has(value) ? set.delete(value) : set.add(value); b.setAttribute("aria-pressed", String(set.has(value))); });
    return b;
  };
  const group = (title, set, items, swatchOf) => {
    const d = h("details", null, h("summary", null, title, set.size ? h("span", { class: "dot" }) : null),
      items.length ? items.map(v => opt(v.replace(/\b\w/g, c => c.toUpperCase()), set, v, swatchOf && swatchOf(v))) : h("div", { class: "kv" }, h("span", null, "Nothing recorded yet")));
    return d;   // collapsed by default
  };
  const stock = h("input", { class: "switch", type: "checkbox", id: "fstock", checked: f.inStock || null });
  stock.addEventListener("change", () => { f.inStock = stock.checked; });
  const min = h("input", { type: "text", inputmode: "decimal", placeholder: "Min", value: f.min, "aria-label": "Minimum price" });
  const max = h("input", { type: "text", inputmode: "decimal", placeholder: "Max", value: f.max, "aria-label": "Maximum price" });
  min.addEventListener("input", () => { f.min = min.value; }); max.addEventListener("input", () => { f.max = max.value; });

  const sheet = h("div", { class: "sheet", role: "dialog", "aria-label": "Filter" },
    h("div", { class: "hd" }, clear, h("b", null, "Filter"), h("button", { class: "btn primary", onclick: close }, "Done")),
    h("div", { class: "field" }, h("label", { for: "fstock" }, "In stock only", stock)),
    h("div", { class: "field" }, h("div", { style: "font-weight:600;margin-bottom:8px" }, "Price (USD)"), h("div", { class: "pricein" }, min, h("span", { style: "color:var(--muted)" }, "to"), max),
      h("div", { class: "hint" }, "Polishes with no listed price are hidden while a price filter is on.")),
    group("Finish", f.finishes, finishes),
    group("Color", f.colors, colors, v => SWATCH[v]));
  const back = h("div", { class: "sheet-back", onclick: e => { if (e.target === back) close(); } }, sheet);
  layer.append(back);
}

/* ---------- CSV export ---------- */
function csvField(v) { v = String(v ?? ""); return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }
async function exportCsv() {
  let dl = null; try { dl = await claude.use("downloads"); } catch (e) {}
  if (!dl) { toast("Downloads aren't available in this view."); return; }
  const list = P.filter(p => statusOf(p) === state.tab).sort((a, b) => cmp(a.brand.name, b.brand.name) || cmp(a.name, b.name));
  if (!list.length) { toast("This list is empty."); return; }
  const header = ["ID", "Brand", "Name", "Collection", "Collection Type", "Released", "Base Colors", "Accent Colors", "Finishes", "Price", "Price per mL", "Stock", "Product Status", "Link"];
  const rows = list.map(p => [p.id, p.brand.name, p.name, p.collection || "", p.ctype || "", releaseText(p) || "", p.base.join(", "), p.other.join(", "),
    p.finishes.map(f => f.replace(/\b\w/g, c => c.toUpperCase())).join(", "), p.price != null ? p.price.toFixed(2) : "", p.ppm != null ? p.ppm.toFixed(2) : "",
    p.stock === 1 ? "In stock" : p.stock === 0 ? "Out of stock" : "", p.pstatus ? PSTATUS[p.pstatus] : "", p.url || ""]);
  const text = String.fromCharCode(0xFEFF) + [header, ...rows].map(r => r.map(csvField).join(",")).join("\r\n") + "\r\n";
  try { await dl.save({ filename: `${STATUS[state.tab].label}-${new Date().toISOString().slice(0, 10)}.csv`, data: text }); }
  catch (e) { if (!e || e.code !== "declined") toast("Couldn't save the file."); }
}

/* ---------- start ---------- */
async function start() {
  state.lists = loadLocal();                  // placeholder until the catalog is read; re-resolved below
  let data;
  try { data = await (await fetch("brands.json")).json(); }
  catch (e) { $("#content").replaceChildren(h("div", { class: "empty" }, h("b", null, "The catalog didn't load"), "Reload the page to try again.")); return; }
  buildCatalog(data);
  state.catalog = true;
  state.lists = loadLocal();
  renderNotice(); renderAll();
  initAccount();
}
start();
</script>
