<style>
/* Layout: sticky header + tab bar over one scrolling column; lists in cards on a soft lavender wash. */
:root {

  --pink: #d9689c;

    --surface-2: #2b2339;
    --ink: #efe9f7;
    --muted: #a99fba;
    --line: #382e4a;
    --accent: #b99cf2;
    --accent-ink: #1b1428;
    --accent-soft: #35294d;

    --bad: #f28c84;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16121d;
  --wash: linear-gradient(135deg, #2c1a2a 0%, #241d38 48%, #172337 100%);
  --surface: #211b2c;
  --surface-2: #2b2339;
  --ink: #efe9f7;
  --muted: #a99fba;
  --line: #382e4a;
  --accent: #b99cf2;

* { box-sizing: border-box; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 8px; }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 10px; align-items: center; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 14px; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }

.summary { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; padding: 0 2px 8px; }
.summary b { color: var(--ink); font-weight: 600; }

.pop { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; }

.subhead .chev { width: 14px; height: 14px; transition: transform .15s; flex: none; }

#bulk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(60, 40, 90, .12); }
#bulk .count { color: var(--muted); font-size: 13px; flex: 1 1 auto; text-align: center; }
.btn.danger { color: var(--bad); }

.thumb { position: relative; flex: none; border-radius: 22%; overflow: hidden; border: 2.5px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }

/* brand tiles (database > brands) */
.brandrow { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 10px 14px; text-align: left; }

.brandrow .nm { font: 600 16px var(--font-display); }

/* detail */
.backbar { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }

.arrow { position: absolute; top: 140px; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); opacity: .9; display: grid; place-items: center; }

.bigsw { height: 160px; border-radius: 18px; border: 1px solid var(--line); display: grid; place-items: center; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }

.sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; flex: none; }

/* keep content clear of the notch / status bar */
body { padding-top: env(safe-area-inset-top, 0px); }

@media (max-width: 480px) {
